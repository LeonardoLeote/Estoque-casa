name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análise e testes
        run: |
          flutter analyze
          flutter test

      # As chaves vêm dos Secrets do repositório, nunca do código-fonte.
      # Configure em: Settings → Secrets and variables → Actions.
      - name: Gerar env.json a partir dos secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY."
            exit 1
          fi
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg anon "$SUPABASE_ANON_KEY" \
            --arg gemini "$GEMINI_API_KEY" \
            '{SUPABASE_URL:$url, SUPABASE_ANON_KEY:$anon, GEMINI_API_KEY:$gemini, GEMINI_MODEL:"gemini-flash-latest"}' \
            > env.json

      - name: Build APK release
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Remover env.json
        if: always()
        run: rm -f env.json

      - uses: actions/upload-artifact@v4
        with:
          name: estoque-casa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

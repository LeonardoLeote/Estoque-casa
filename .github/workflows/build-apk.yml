name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      # Os testes usam chaves de exemplo e um http.Client falso: nada sai
      # para a rede, mas as constantes precisam estar definidas.
      - name: Análise e testes
        run: |
          flutter analyze
          flutter test --dart-define-from-file=env.example.json

      # As chaves vêm dos Secrets do repositório, nunca do código-fonte.
      # Configure em: Settings → Secrets and variables → Actions.
      - name: Preparar configuração
        id: cfg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            jq -n \
              --arg url "$SUPABASE_URL" \
              --arg anon "$SUPABASE_ANON_KEY" \
              --arg gemini "$GEMINI_API_KEY" \
              --arg commit "${GITHUB_SHA:0:7}" \
              '{SUPABASE_URL:$url, SUPABASE_ANON_KEY:$anon, GEMINI_API_KEY:$gemini, GEMINI_MODEL:"gemini-flash-latest", APP_BUILD_COMMIT:$commit}' \
              > env.json
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets SUPABASE_URL/SUPABASE_ANON_KEY ausentes. Vou apenas verificar se o projeto compila, sem gerar APK utilizável."
            cp env.example.json env.json
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          fi

      # Sem uma chave estável, cada run assina com uma chave de debug nova e
      # o Android recusa instalar por cima da versão anterior.
      - name: Preparar chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/estoque-casa.jks
            cat > android/key.properties <<EOF
          storeFile=estoque-casa.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=estoquecasa
          keyPassword=$KEYSTORE_PASSWORD
          EOF
            # Falhar aqui, com mensagem clara, é melhor do que deixar o
            # Gradle quebrar depois com um stack trace de 80 linhas.
            if [ ! -s android/estoque-casa.jks ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 não decodificou para um arquivo válido."
              exit 1
            fi
            if ! keytool -list -keystore android/estoque-casa.jks \
                 -storepass "$KEYSTORE_PASSWORD" -alias estoquecasa >/dev/null 2>&1; then
              echo "::error::Não consegui abrir o keystore. Confira ANDROID_KEYSTORE_PASSWORD e se o alias é 'estoquecasa'."
              exit 1
            fi
            echo "Keystore validado. Impressão digital:"
            keytool -list -keystore android/estoque-casa.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias estoquecasa \
              | grep -i "SHA-256" || true
            echo "assinado=proprio" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: o APK sai com chave de debug e NÃO instala por cima da versão anterior."
            echo "assinado=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release
        if: steps.cfg.outputs.configurado == 'true'
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Conferir assinatura do APK
        if: steps.cfg.outputs.configurado == 'true' && steps.chave.outputs.assinado == 'proprio'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" \
            | grep -i "SHA-256" | head -2
          echo "Se esta impressão digital mudar entre builds, a atualização falha."

      - name: Remover chave de assinatura
        if: always()
        run: rm -f android/estoque-casa.jks android/key.properties

      # Sem secrets não dá para gerar um APK que funcione, mas ainda vale
      # provar que o lado Android (Gradle, desugaring, plugins) compila.
      - name: Verificar compilação Android (sem secrets)
        if: steps.cfg.outputs.configurado != 'true'
        run: flutter build apk --debug --dart-define-from-file=env.json

      - name: Remover env.json
        if: always()
        run: rm -f env.json

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.configurado == 'true'
        with:
          name: estoque-casa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Aviso final
        if: steps.cfg.outputs.configurado != 'true'
        run: |
          echo "### ⚠️ APK não gerado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "O projeto compila, mas faltam os secrets do repositório." >> "$GITHUB_STEP_SUMMARY"
          echo "Cadastre em **Settings → Secrets and variables → Actions**:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`SUPABASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`SUPABASE_ANON_KEY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`GEMINI_API_KEY\` (opcional, só para ler nota fiscal)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Depois rode o workflow de novo em **Actions → Build APK → Run workflow**." >> "$GITHUB_STEP_SUMMARY"
